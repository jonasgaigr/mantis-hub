id: fig01
message: >-
  MANTIS is one quality-controlled chain from a sensor in the field to a policy
  indicator, and the three packages each own a different stretch of it.
caption: >-
  MANTIS runs a single quality-controlled chain from sensors in the field to
  policy indicators. Package 1 improves the schemes that feed the chain,
  Package 2 carries data through verification, benchmarking and publication,
  and Package 3 builds the capacity that keeps it running.
alt: >-
  A left-to-right chain from field sensors through AI identification and
  benchmarking to published data and policy indicators, with numbered
  quality gates on the connectors. Brackets above mark Packages 1 and 2; a
  band below marks Package 3.
orientation: landscape

