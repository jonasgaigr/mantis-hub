    <text x="2562.89" y="1897.23" font-size="30.00" fill="#555555" text-anchor="middle">dashboard (M2.2, Jul 28)</text>
    <text x="2562.89" y="1941.83" font-size="28.00" fill="#555555" text-anchor="middle">auto-updating from GBIF (O2)</text>
