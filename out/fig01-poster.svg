    <text x="1872.88" y="610.52" font-size="46.00" fill="#111111" text-anchor="middle" font-weight="600">Package 2 — Data flows</text>
    <text x="994.15" y="653.16" font-size="28.00" fill="#555555" text-anchor="start">handover: 1.2/1.3 → 2.1 (risk R3)</text>
    <rect x="33.70" y="2067.28" width="3218.35" height="128.74" rx="20.22" fill="#E6E6E6" stroke="#999999" stroke-width="5.06"/>
