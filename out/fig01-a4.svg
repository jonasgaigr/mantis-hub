    <text x="555.75" y="174.59" font-size="15.00" fill="#111111" text-anchor="middle" font-weight="600">Package 2 — Data flows</text>
    <text x="295.00" y="189.99" font-size="11.00" fill="#555555" text-anchor="start">handover: 1.2/1.3 → 2.1 (risk R3)</text>
