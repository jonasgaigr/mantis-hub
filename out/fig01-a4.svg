<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="A left-to-right chain from field sensors through AI identification and benchmarking to published data and policy indicators, with numbered quality gates on the connectors. Brackets above mark Packages 1 and 2; a band below marks Package 3.">
  <title>MANTIS is one quality-controlled chain from a sensor in the field to a policy indicator, and the three packages each own a different stretch of it.</title>
  <desc>MANTIS runs a single quality-controlled chain from sensors in the field to policy indicators. Package 1 improves the schemes that feed the chain, Package 2 carries data through verification, benchmarking and publication, and Package 3 builds the capacity that keeps it running.</desc>
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker>
    <marker id="arrow-feeds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0.5 0.5 L 9 5 L 0.5 9.5" fill="none" stroke="#555555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#FFFFFF"/>
