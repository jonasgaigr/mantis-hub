name: figures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Build and test only. Publishing to Pages is static.yml's job -- two workflows
# deploying to the same Pages environment on one push race each other.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Must match the R version renv.lock records (4.6.1): the locked
          # packages need R >= 4.4, so pinning 4.3 made setup-renv fail before
          # the figures were ever built.
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # figures.qmd declares an html *and* a pdf format, so `quarto render`
          # always shells out to LaTeX. The runner has no TeX installation and
          # Quarto does not install one on its own -- it stops with "No TeX
          # installation was detected", which is what failed the render step.
          tinytex: true

      # rsvg-convert keeps the text live when the A4 figures go into the PDF.
      # Without it svg_to_pdf() would fall back to a headless browser; on CI we
      # want the converter the project actually prefers.
      - name: Install librsvg
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build the figures
        run: Rscript -e 'targets::tar_make()'

      # The proposal contradicts itself about the tier of A1.5 and A1.6; the
      # build prints that rather than resolving it. Surface it in the log.
      - name: Report unresolved inputs
        run: |
          echo "::group::MISSING-INPUTS.md"
          cat MISSING-INPUTS.md
          echo "::endgroup::"

      - name: Check every spec against the nine rules
        run: Rscript -e 'testthat::test_dir("tests/testthat")'

      - name: Render the document and the deck
        run: quarto render

      # data/ is the extracted input and out/*.svg is the published figure, and
      # both are committed. If a fresh build disagrees with what is in the repo,
      # the deployed deck is showing a stale figure -- so fail rather than warn.
      - name: Fail if the build left the committed files dirty
        run: |
          if [ -n "$(git status --porcelain data/ out/)" ]; then
            echo "The build changed tracked files that were not committed:"
            git --no-pager status --short -- data/ out/
            git --no-pager diff -- data/ out/
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            out/
            index.html
            core-pitch.html
            full-pitch.html
            figures.html
            figures.pdf
            slides.html
          if-no-files-found: error
